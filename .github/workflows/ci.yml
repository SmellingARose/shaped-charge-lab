# CI: macOS arm64 (Metal + CPU) and Windows x64 (MSVC, CPU; Direct3D for the UI). Pushes and pull requests build,
# smoke-test and package. A tag v<version> (matching project(VERSION) in CMakeLists.txt) builds, packages and
# publishes a GitHub release with the two installers.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # 6.10: Qt 6.8 adds the AGL framework, gone from the macOS 26 SDK; aqtinstall 3.3 cannot install 6.11 on Windows yet
  QT_VERSION: "6.10.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-arm64
          # VS 2022 (MSVC v143): the toolchain the AMD HIP SDK supports; windows-latest ships only VS 2026, whose
          # MSVC 14.5x headers do not compile with the HIP SDK 6.4 clang.
          - os: windows-2022
            name: windows-x64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in CMakeLists.txt
        if: github.ref_type == 'tag'
        run: |
          V=$(sed -nE 's/^project\(ShapedChargeLab VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          [[ "v$V" == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME, but CMakeLists.txt says $V: bump project(VERSION) first"; exit 1; }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          aqtversion: "==3.3.*"
          cache: true

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # AMD GPU backend (scl_gpu.dll): built by the HIP SDK's clang in its own tree, deployed next to the app.
      # Only the SDK core MSI is installed (the full AMD package would also install a display driver).
      - name: AMD HIP SDK cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hipsdk
          key: hip-sdk-25.Q3-core

      - name: AMD HIP SDK 6.4 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\hipsdk"
          $msi = "$dir\Packages\Apps\ROCmSDKPackages\SDKCore\ROCm_SDK_Core.msi"
          if (-not (Test-Path $msi)) {
            $exe = "$env:RUNNER_TEMP\hip-sdk.exe"
            Invoke-WebRequest "https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-25.Q3-Win10-Win11-For-HIP.exe" -OutFile $exe
            New-Item -ItemType Directory -Force $dir | Out-Null
            # 7-Zip (on the runner image) reads AMD's self-extracting package; windows-2022's bsdtar does not
            7z x -y "-o$dir" $exe Packages\Apps\ROCmSDKPackages\SDKCore | Select-Object -Last 3
            Remove-Item $exe
            if (-not (Test-Path $msi)) { Write-Error "ROCm_SDK_Core.msi not found in the AMD package"; exit 1 }
          }
          $p = Start-Process msiexec -ArgumentList '/i', $msi, '/qn', '/l*v', "$env:RUNNER_TEMP\hip-sdk.log" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\hip-sdk.log" -Tail 40; exit $p.ExitCode }
          "HIP_PATH=C:\Program Files\AMD\ROCm\6.4\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: GPU backend (Windows, scl_gpu.dll)
        if: runner.os == 'Windows'
        shell: cmd
        run: tools\windows\build-hip.bat

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        # The app and core use the platform compiler; on Windows the GPU backend from build-hip is deployed beside it.
        run: |
          GPU=""
          [[ "$RUNNER_OS" == "Windows" ]] && GPU="-DSCL_GPU_PLUGIN=$(cygpath -m "$PWD")/build-hip/core/scl_gpu.dll"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSCL_GPU=OFF $GPU

      - name: Build
        run: cmake --build build

      - name: Core smoke (CPU solver, 15 s)
        if: github.ref_type != 'tag'
        run: build/core/scl_smoke 15 2 cpu

      - name: Deploy (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --target scl_deploy
          ls build/deploy/vcruntime140.dll build/deploy/msvcp140.dll   # app-local MSVC runtime
          ls build/deploy/scl_gpu.dll                                     # AMD GPU backend

      - name: App launch smoke (screenshot)
        if: github.ref_type != 'tag'
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"   # WARP on Windows runners (no GPU)
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "build/app/Shaped Charge Lab.app/Contents/MacOS/Shaped Charge Lab" --quit-after 8 --screenshot app-${{ matrix.name }}.png
          else
            pwsh -Command '$p = Start-Process -FilePath "build/deploy/Shaped Charge Lab.exe" -ArgumentList "--quit-after","8","--screenshot","app-${{ matrix.name }}.png" -PassThru -Wait; exit $p.ExitCode'
          fi
          ls -la app-${{ matrix.name }}.png

      - name: Installer (macOS .dmg, ad-hoc signed)
        if: runner.os == 'macOS'
        run: packaging/macos/make_dmg.sh build dist

      - name: Installer (Windows .msi, WiX v5)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$USERPROFILE/.dotnet/tools:$PATH"
          packaging/windows/make_msi.sh build dist

      - name: Installer smoke (install, launch, uninstall)
        if: github.ref_type != 'tag'
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: "1"
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            M=$(mktemp -d); hdiutil attach -nobrowse -mountpoint "$M" dist/*.dmg
            cp -R "$M/Shaped Charge Lab.app" "$RUNNER_TEMP/"; hdiutil detach "$M"
            "$RUNNER_TEMP/Shaped Charge Lab.app/Contents/MacOS/scl_smoke" 5 2 cpu
            "$RUNNER_TEMP/Shaped Charge Lab.app/Contents/MacOS/Shaped Charge Lab" --quit-after 8 --screenshot installed-${{ matrix.name }}.png
          else
            MSI=$(cygpath -w dist/*.msi)
            pwsh -Command "\$p = Start-Process msiexec -ArgumentList '/i','$MSI','/qn','/l*v','msi.log' -PassThru -Wait; exit \$p.ExitCode" || { tail -50 msi.log; exit 1; }
            ls -la "/c/Program Files/Shaped Charge Lab" || { iconv -f UTF-16LE -t UTF-8 msi.log | grep -iE "error|return value 3|INSTALLFOLDER" | head -40; exit 1; }
            ls "/c/Program Files/Shaped Charge Lab/scl_gpu.dll"
            "/c/Program Files/Shaped Charge Lab/scl_smoke.exe" 5 2 cpu
            pwsh -Command "\$p = Start-Process -FilePath 'C:/Program Files/Shaped Charge Lab/Shaped Charge Lab.exe' -ArgumentList '--quit-after','8','--screenshot','installed-${{ matrix.name }}.png' -PassThru -Wait; exit \$p.ExitCode"
            pwsh -Command "\$p = Start-Process msiexec -ArgumentList '/x','$MSI','/qn' -PassThru -Wait; exit \$p.ExitCode"
            test ! -e "/c/Program Files/Shaped Charge Lab/Shaped Charge Lab.exe"
          fi
          ls -la installed-${{ matrix.name }}.png

      - name: Collect artefacts
        run: |
          mkdir -p dist
          rm -rf dist/stage
          cp app-${{ matrix.name }}.png installed-${{ matrix.name }}.png dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: shapedchargelab-${{ matrix.name }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Publish the GitHub release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" --generate-notes \
            --title "Shaped Charge Lab ${GITHUB_REF_NAME}" \
            artefacts/*/ShapedChargeLab-macOS.dmg artefacts/*/ShapedChargeLab-Windows.msi
